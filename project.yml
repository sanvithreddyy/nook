name: Nook
options:
  bundleIdPrefix: com.sanvith
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
packages:
  # Updates: finds, downloads, checks and installs new versions; Nook draws its own UI for it.
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.10.1
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
targets:
  Nook:
    type: application
    platform: macOS
    sources:
      - path: Nook
      - path: Vendor/MediaRemoteAdapter/mediaremote-adapter.pl
        buildPhase: resources
      # Its license travels with the app, as the BSD terms ask of binary copies.
      - path: Vendor/MediaRemoteAdapter/LICENSE
        buildPhase: resources
      # Sparkle's too, as its MIT terms ask of copies.
      - path: Vendor/Sparkle/Sparkle-LICENSE
        buildPhase: resources
    configFiles:
      Debug: Config/Signing.xcconfig
      Release: Config/Signing.xcconfig
    scheme:
      testTargets: [NookTests]
    dependencies:
      - framework: Vendor/MediaRemoteAdapter/MediaRemoteAdapter.framework
        embed: true
        link: false
        codeSign: true
      - package: Sparkle
    info:
      path: Nook/Info.plist
      properties:
        CFBundleDisplayName: Nook
        CFBundleShortVersionString: "0.1.1"
        CFBundleVersion: "2"
        LSUIElement: true
        LSMinimumSystemVersion: "15.0"
        SUFeedURL: https://github.com/sanvithreddyy/nook/releases/latest/download/appcast.xml
        # Updates install only when signed with the private half, kept in the release machine's keychain.
        SUPublicEDKey: $(SPARKLE_PUBLIC_KEY)
        # Checks once a day without asking first; Settings shows what it finds.
        SUEnableAutomaticChecks: true
        NSCalendarsFullAccessUsageDescription: Nook shows your next event in the notch.
        NSBluetoothAlwaysUsageDescription: Nook shows a notice in the notch when headphones and other devices connect.
        NSRemindersFullAccessUsageDescription: Nook shows a list of your reminders in the notch, where you can tick them off and add new ones.
        NSLocationUsageDescription: Nook shows the weather where you are in the notch.
        NSLocationWhenInUseUsageDescription: Nook shows the weather where you are in the notch.
    entitlements:
      path: Nook/Nook.entitlements
      properties:
        com.apple.security.personal-information.calendars: true
        com.apple.security.personal-information.location: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sanvith.nook
        MARKETING_VERSION: "0.1.1"
        SPARKLE_PUBLIC_KEY: lOZ0G9u0J5hhENfhxFNGbDLnq9nQKxo/aC15wKJMfDI=
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: YES
  NookTests:
    type: bundle.unit-test
    platform: macOS
    # Compiles the app's code directly, so tests never launch the notch app.
    sources:
      - NookTests
      - path: Nook
        excludes: [App/NookApp.swift, Info.plist, Nook.entitlements]
    dependencies:
      - package: Sparkle
    configFiles:
      Debug: Config/Signing.xcconfig
      Release: Config/Signing.xcconfig
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.sanvith.nook.tests
